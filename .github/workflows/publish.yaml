name: publish
on:
  push:
    tags:
      - "**v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
jobs:
  dart-pipeline:
    uses: affinidi/pipeline-dart/.github/workflows/publish.yaml@main
    secrets: inherit
    with:
      publish: true
      # Keep in sync with the melos dev_dependency (see release.yaml).
      melos-version: '6.3.3'